#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ============ 统一入口 ============
    server {
        listen       80;
        server_name  _;

        # --- 后端 API（优先级最高）---
        # /admin/api/v1/... → 后端 /api/v1/...  （后台前端的 Vite proxy 规则在这里落地）
        location /admin/api/ {
            rewrite ^/admin/api/(.*)$ /api/$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api/v1/... → 后端 /api/v1/...
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 爬虫全量采集约 3~4 分钟，默认 60s 会被掐断
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --- 后台管理前端 ---
        # /admin/... → admin-web dev server（vite base=/admin/，自身已处理好路由）
        location /admin/ {
            proxy_pass http://127.0.0.1:5173;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # HMR 支持（Vite dev server 的 WebSocket）
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- 门户前端（根路径）---
        # /... → public-web dev server
        location / {
            proxy_pass http://127.0.0.1:5174;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
