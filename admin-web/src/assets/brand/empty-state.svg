      <stop offset="1" stop-color="#818CF8" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(150 110) scale(120)" gradientUnits="userSpaceOnUse">
