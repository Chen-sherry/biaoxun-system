<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="标讯速递">
  <defs>
    <linearGradient id="frame" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sweep" x1="32" y1="32" x2="32" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 切角科技外框 -->
  <path d="M15 4H49L60 15V49L49 60H15L4 49V15Z" stroke="url(#frame)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M19 10H45L54 19" stroke="url(#frame)" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- 雷达同心弧 -->
  <circle cx="32" cy="32" r="7" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.9"/>
  <path d="M32 17A15 15 0 1 1 17.4 39.6" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M32 10A22 22 0 0 1 52.1 21.5" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.65"/>
  <!-- 扫描线 -->
  <path d="M32 32L32 10" stroke="url(#sweep)" stroke-width="2" stroke-linecap="round" filter="url(#g)"/>
  <!-- 中心与数据节点 -->
  <circle cx="32" cy="32" r="3.2" fill="#67E8F9" filter="url(#g)"/>
  <circle cx="50" cy="48" r="2.1" fill="#38BDF8"/>
  <circle cx="13" cy="22" r="1.8" fill="#22D3EE"/>
  <circle cx="47" cy="16" r="1.6" fill="#818CF8"/>
</svg>
